name: Diagnose Linux saved-profile replay

on:
  push:
    tags:
      - 'correlated-signals-linux-diagnostic-*'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_PROCESSOR_COUNT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: '9.0.x'
      - name: Build the diagnostic image and download saved inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostic" "$RUNNER_TEMP/inputs"
          lscpu > "$RUNNER_TEMP/diagnostic/hardware.txt"
          dotnet build ArticleReplication/ArticleReplication.csproj -c Release -m:1 -p:UseSharedCompilation=false -p:BuildReplicationContainer=true -p:ArticleContainerTag=acesim:diagnostic -p:ArticleContainerRevision="$GITHUB_SHA" -p:ArticleContainerRecords="$RUNNER_TEMP/build-records"
          curl --fail --location --retry 3 https://github.com/mbabramo/correlated-signals-article/releases/download/replication-20261004/correlated-signals-saved-solutions.zip --output "$RUNNER_TEMP/inputs.zip"
          unzip -q "$RUNNER_TEMP/inputs.zip" -d "$RUNNER_TEMP/inputs"
      - name: Inspect the five differing replays without new solves
        shell: bash
        run: |
          set -euo pipefail
          cases='grid__signals-12-offers-8__complete__ra__cost-1,merits-distribution__polarized__american__ra__cost-1,merits-distribution__polarized__american__rn__cost-1,merits-distribution__polarized__complete__ra__cost-1,merits-distribution__polarized__complete__rn__cost-1'
          docker run --rm --network none --cpus 1 -e ARTICLE_REPLAY_DIAGNOSTICS=1 -v "$RUNNER_TEMP/inputs:/inputs:ro" -v "$RUNNER_TEMP/diagnostic:/output" acesim:diagnostic run --input /inputs --output /output/default --steps Primary --cases "$cases" --missing wait --workers 1
          docker run --rm --network none --cpus 1 -e ARTICLE_REPLAY_DIAGNOSTICS=1 -e DOTNET_EnableHWIntrinsic=0 -v "$RUNNER_TEMP/inputs:/inputs:ro" -v "$RUNNER_TEMP/diagnostic:/output" acesim:diagnostic run --input /inputs --output /output/no-intrinsics --steps Primary --cases "$cases" --missing wait --workers 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-replay-diagnostic
          path: ${{ runner.temp }}/diagnostic/
          retention-days: 30
          if-no-files-found: error
