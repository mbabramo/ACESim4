name: Check public correlated-signals container

on:
  push:
    tags:
      - 'correlated-signals-public-check-*'

permissions:
  contents: read

jobs:
  anonymous-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Pull without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          version="${GITHUB_REF_NAME#correlated-signals-public-check-}"
          version="${version%%-retry-*}"
          [[ "$version" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}([.][0-9]+)?$ ]]
          image="ghcr.io/mbabramo/acesim-correlated-signals:$version"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG" "$RUNNER_TEMP/public-check"
          docker pull "$image" 2>&1 | tee "$RUNNER_TEMP/public-check/anonymous-pull.log"
          docker image inspect "$image" > "$RUNNER_TEMP/public-check/image-inspect.json"
      - name: Run the downloaded application and rendering preflight
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cpus 1 "$IMAGE" --help
          docker run --rm --network none --cpus 1 --mount "type=bind,source=$RUNNER_TEMP/public-check,target=/output" "$IMAGE" doctor --output /output/doctor
          docker run --rm --network none --cpus 1 --mount "type=bind,source=$RUNNER_TEMP/public-check,target=/output" "$IMAGE" test-shortcuts --output /output/shortcut-tests.json
          docker run --rm --network none --cpus 1 --mount "type=bind,source=$RUNNER_TEMP/public-check,target=/output" "$IMAGE" test-reporting-comparison --output /output/reporting-comparison-tests.json
          docker run --rm --network none --cpus 1 --mount "type=bind,source=$RUNNER_TEMP/public-check,target=/output" "$IMAGE" test-approximate-comparisons --output /output/approximate-comparison-tests.json
      - name: Download the public saved solutions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/journal replication/solutions"
          curl --fail --location --retry 3 https://github.com/mbabramo/correlated-signals-article/releases/download/replication-20261004/correlated-signals-saved-solutions.zip --output "$RUNNER_TEMP/saved-solutions.zip"
          unzip -q "$RUNNER_TEMP/saved-solutions.zip" -d "$RUNNER_TEMP/journal replication/solutions"
      - name: Replicate every research output from the publicly downloaded image
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/journal replication"
          docker run --rm --network none --cpus 4 -v "${PWD}/solutions:/inputs:ro" -v "${PWD}/output:/output" "$IMAGE" run --input /inputs --output /output/run --missing wait --workers 4 2>&1 | tee "$RUNNER_TEMP/public-check/replication.log"
      - name: Fetch the published scientific regression reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mbabramo/correlated-signals-article
          ref: 0d080991296db4099ea5af2326787a45a813ad4d
          path: published-reference
          persist-credentials: false
      - name: Verify every scientific profile and retain the entire collection
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cpus 1 --mount "type=bind,source=$RUNNER_TEMP/journal replication/output,target=/output" --mount "type=bind,source=$GITHUB_WORKSPACE/published-reference,target=/reference,readonly" "$IMAGE" verify-container-release --run /output/run --reference-article /reference --output /output/release-validation.json
          cp "$RUNNER_TEMP/journal replication/output/release-validation.json" "$RUNNER_TEMP/public-check/"
          cp "$RUNNER_TEMP/journal replication/output/run/article/Results/Aggregated Data/reporting-inventory.json" "$RUNNER_TEMP/public-check/"
      - name: Retain execution records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-check/receipts"
          shopt -s nullglob
          run="$RUNNER_TEMP/journal replication/output/run"
          for f in "$run"/*.json; do cp "$f" "$RUNNER_TEMP/public-check/receipts/"; done
          if [[ -d "$run/logs" ]]; then cp -r "$run/logs" "$RUNNER_TEMP/public-check/replication-logs"; fi
          if [[ -d "$run/article" ]]; then tar -C "$run" -czf "$RUNNER_TEMP/public-check/generated-collection.tar.gz" article; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: correlated-signals-public-download-check
          path: ${{ runner.temp }}/public-check/
          retention-days: 30
          if-no-files-found: error
